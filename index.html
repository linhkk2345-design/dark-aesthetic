<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Aesthetic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Hiệu ứng hạt bụi nền */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Màn hình mở đầu */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .author-text {
            font-size: 13px;
            letter-spacing: 2px;
            color: #777;
            text-transform: lowercase;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .heart-container {
            position: relative;
            margin-bottom: 35px;
        }

        .broken-heart {
            font-size: 60px;
            color: #1a1a1a;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            user-select: none;
        }

        .tap-to-open {
            font-size: 11px;
            letter-spacing: 4px;
            color: #888;
            text-transform: uppercase;
            animation: pulseText 2s infinite ease-in-out;
            font-weight: 400;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }

        /* Hiệu ứng trái tim rơi */
        .falling-heart {
            position: fixed;
            top: -50px;
            color: #222;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 2;
            animation: fallHeart linear forwards;
        }

        @keyframes fallHeart {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translate(100vw, 105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Giao diện xem video / nội dung chính */
        #main-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
            z-index: 5;
        }

        #main-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .content-box {
            width: 90%;
            max-width: 360px;
            padding: 30px 20px;
            background: #121212;
            border: 1px solid #222;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        .content-box h2 {
            font-size: 15px;
            font-weight: 400;
            color: #ccc;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .content-box p {
            font-size: 12px;
            color: #777;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-tiktok {
            display: block;
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            border-radius: 30px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }

        .btn-tiktok:active {
            transform: scale(0.98);
        }

        .btn-tiktok:hover {
            background: #dcdcdc;
        }
    </style>
</head>
<body>

    <!-- Hiệu ứng hạt sáng nền -->
    <div id="particles"></div>

    <!-- Màn hình mở đầu -->
    <div id="intro-screen" onclick="openWebsite()">
        <div class="author-text">tác phẩm ngu thích làm màu</div>
        <div class="heart-container">
            <div class="broken-heart">💔</div>
        </div>
        <div class="tap-to-open">tap to open</div>
    </div>

    <!-- Màn hình chính -->
    <div id="main-screen">
        <div class="content-box">
            <h2>TikTok Dark Aesthetic</h2>
            <p>Nhấn vào bên dưới để thưởng thức video và âm thanh gốc trực tiếp trên TikTok.</p>
            <a href="https://vt.tiktok.com/ZSgFAhEno/" target="_blank" class="btn-tiktok">XEM TRÊN TIKTOK 🖤</a>
        </div>
    </div>

    <script>
        // Tạo hiệu ứng hạt bụi phía sau
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 3 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(particle);
        }

        // Tạo hiệu ứng trái tim rơi liên tục ở màn hình mở đầu
        function createFallingHeart() {
            const intro = document.getElementById('intro-screen');
            if (intro.classList.contains('hidden')) return;

            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.innerHTML = Math.random() > 0.3 ? '🖤' : '💔';
            heart.style.left = `${Math.random() * -20}vw`;
            heart.style.fontSize = `${Math.floor(Math.random() * 15) + 12}px`;
            
            const duration = Math.random() * 3 + 4;
            heart.style.animationDuration = `${duration}s`;

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createFallingHeart, 400);

        // Xử lý khi người dùng chạm mở
        function openWebsite() {
            const introScreen = document.getElementById('intro-screen');
            const mainScreen = document.getElementById('main-screen');

            introScreen.classList.add('hidden');
            setTimeout(() => {
                mainScreen.classList.add('active');
            }, 400);
        }
    </script>
</body>
</html>
